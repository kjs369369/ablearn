<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>og</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#FFF8EF;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    color:#191919; display:flex; flex-direction:column; justify-content:center;
    padding:0 88px; position:relative;
  }
  .stripe{position:absolute;left:0;top:0;bottom:0;width:24px;background:#1B7355}
  .logo{font-size:44px;font-weight:800;color:#1B7355;letter-spacing:-.02em;margin-bottom:28px}
  h1{font-size:86px;font-weight:900;line-height:1.22;letter-spacing:-.03em}
  p{font-size:38px;color:#4A4340;margin-top:26px;font-weight:600}
  .row{display:flex;gap:14px;margin-top:44px}
  .chip{
    background:#E7F3ED;color:#1B7355;border:3px solid #1B7355;
    font-size:32px;font-weight:800;padding:14px 30px;border-radius:999px;
  }
  .chip.warm{background:#FCEEE3;color:#C85A1E;border-color:#C85A1E}
  .stages{position:absolute;right:80px;bottom:64px;font-size:56px;letter-spacing:10px}
</style>
</head>
<body>
  <div class="stripe"></div>
  <div class="logo">ABLEARN.</div>
  <h1>나의 디지털 역량을<br>확인해 볼까요?</h1>
  <p>스마트폰으로 할 수 있는 것만 편하게 골라 주세요.</p>
  <div class="row">
    <span class="chip">10개 문항</span>
    <span class="chip">약 2분</span>
    <span class="chip warm">추천 교육반 안내</span>
  </div>
  <div class="stages">🌱🌿🌳⭐</div>
</body>
</html>
